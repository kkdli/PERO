name: 功能建议 / Feature request
description: 分享你的使用场景和想法 / Share a use case or an idea
title: "[Idea] "
body:
  - type: textarea
    id: context
    attributes:
      label: 你想在什么场景下使用？ / What is the use case?
      description: 描述想完成的事情，或现在不方便的地方。 / Describe what you want to do or what currently gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的建议 / Your suggestion
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 补充信息 / Additional context
      description: 可以补充设备、示例或其他想法。 / Add a device, example, or anything else that helps explain the idea.
